apply plugin: 'java'

repositories {
    // The SDK ships as GitHub release assets, which are not a Maven layout, so the
    // release download endpoint is exposed as an ivy repository with an explicit
    // pattern:  <url>/v3.2.0/graal-native-sdk-3.2.0-aarch64-osx.zip
    ivy {
        url = 'https://github.com/dxFeed/dxfeed-graal-native-sdk/releases/download'
        patternLayout {
            artifact 'v[revision]/[module]-[revision]-[classifier].[ext]'
        }
        // no ivy.xml or POM is published next to the assets
        metadataSources { artifact() }
        content { includeModule('com.dxfeed', 'graal-native-sdk') }
    }
}

def native_version = '3.8.0'
def name = 'graal-native-sdk'
dependencies {
    // DxFeedGraalNativeSdk.xcframework: static frameworks for iOS and the iOS Simulator, a dynamic one for macOS.
    implementation(group: 'com.dxfeed', name: "${name}", version: "${native_version}", classifier: 'xcframework', ext: 'zip')
}

task fetchDependencies(type: Copy) {
    outputs.upToDateWhen { false }

    doFirst {
        new File('downloads').mkdirs()
        new File('graal_builds').deleteDir()
        println "Downloaded dep:"
        sourceSets.main.runtimeClasspath.each {
            println it
        }
    }

    // Lazy `from {}` defers resolving runtimeClasspath to task execution time,
    // so tasks that don't depend on fetchDependencies don't trigger dependency
    // resolution during Gradle's configuration phase.
    from { sourceSets.main.runtimeClasspath }
    into 'downloads'

    doLast {
        println "fetch dep:"
        new File('graal_builds').mkdirs()
        fileTree(dir: 'downloads', includes: ['*-xcframework.zip']).each { zipFile ->
            // ditto keeps the symbolic links of the macOS framework (Versions/Current, ...), zipTree does not. A plain
            // process rather than exec {}, which Gradle 9 no longer has in a task action (CI runs the system gradle).
            def ditto = ['ditto', '-x', '-k', zipFile.path, 'graal_builds'].execute(null, projectDir)
            ditto.waitForProcessOutput(System.out, System.err)
            if (ditto.exitValue() != 0) {
                throw new GradleException("ditto could not unpack ${zipFile.name}: ${ditto.exitValue()}")
            }
        }
        // The headers for module.map: a module map cannot name the headers inside a framework (they belong to its
        // module), and the headers of all the slices are the same.
        copy {
            from 'graal_builds/DxFeedGraalNativeSdk.xcframework/ios-arm64/DxFeedGraalNativeSdk.framework/Headers'
            into 'graal_builds/include'
        }

        new File('downloads').deleteDir()
    }
}

defaultTasks 'fetchDependencies'
