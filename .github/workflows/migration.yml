# DXFeedFramework with DxFeedGraalNativeSdk.xcframework instead of the files of the archives (the migration guide,
# .github/migration): the XCFramework of the graal-native-sdk release, then DXFeedFramework is
# built for iOS, tested on macOS and in the iOS Simulator (arm64, x86_64), and its size is measured (Release).
name: XCFramework migration

on:
  push:
    branches: [ci/xcframework-migration]

env:
  SDK_VERSION: 3.8.0
  TOOL: .github/sdk-tools/build.py

jobs:
  xcframework:
    name: Take the XCFramework
    runs-on: ubuntu-latest
    steps:
      - name: Download the XCFramework of the release
        run: |
          curl --fail --location --silent --show-error --remote-name             "https://github.com/dxFeed/dxfeed-graal-native-sdk/releases/download/v${SDK_VERSION}/graal-native-sdk-${SDK_VERSION}-xcframework.zip"
          ls -l graal-native-sdk-*-xcframework.zip

      - name: Upload the XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: graal-native-sdk-*-xcframework.zip

  ios:
    name: Build (iOS)
    needs: xcframework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xcframework
          path: ${{ runner.temp }}
      - name: Migrate
        run: .github/migration/migrate.sh "${RUNNER_TEMP}"/graal-native-sdk-*-xcframework.zip
      - name: Build
        run: >
          xcodebuild build -project DXFeedFramework.xcodeproj -scheme DXFeedFramework
          -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO

  macos:
    name: Test (macOS ${{ matrix.arch }})
    needs: xcframework
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xcframework
          path: ${{ runner.temp }}
      - name: Migrate
        run: .github/migration/migrate.sh "${RUNNER_TEMP}"/graal-native-sdk-*-xcframework.zip
      - name: Test
        timeout-minutes: 30
        run: >
          xcodebuild test -project DXFeedFramework.xcodeproj -scheme DXFeedFramework
          -testPlan DXExceptPublisherTests -destination 'platform=macOS,arch=${{ matrix.arch }}' CODE_SIGNING_ALLOWED=NO
      - name: The embedded framework
        if: always()
        run: |
          framework=$(find ~/Library/Developer/Xcode/DerivedData -path '*Build/Products/*/DXFeedFramework.framework' -maxdepth 6 | head -n 1)
          find "${framework}/" -maxdepth 4 | sort | head -40
          xcrun otool -L "${framework}/DXFeedFramework" | grep -i graal || true

  ios-simulator:
    name: Test (iOS Simulator ${{ matrix.arch }})
    needs: xcframework
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xcframework
          path: ${{ runner.temp }}
      - name: Migrate
        run: .github/migration/migrate.sh "${RUNNER_TEMP}"/graal-native-sdk-*-xcframework.zip
      - name: Choose a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [(runtime, device) for runtime, items in devices.items() if ".iOS-" in runtime
                 for device in items if device["name"].startswith("iPhone")]
          version = lambda runtime: [int(part) for part in runtime.rsplit(".iOS-", 1)[1].split("-")]
          runtime, device = max(ios, key=lambda item: version(item[0]))
          print(runtime, device["name"], file=sys.stderr)
          print(device["udid"])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build the tests
        run: >
          xcodebuild build-for-testing -project DXFeedFramework.xcodeproj -scheme DXFeedFramework
          -testPlan DXExceptPublisherTests -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Boot the simulator
        run: xcrun simctl bootstatus ${{ steps.simulator.outputs.udid }} -b
      - name: Test
        timeout-minutes: 30
        run: >
          xcodebuild test-without-building -project DXFeedFramework.xcodeproj -scheme DXFeedFramework
          -testPlan DXExceptPublisherTests -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          -derivedDataPath build/DerivedData -resultBundlePath build/TestResults.xcresult
          -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300

  size:
    name: Size (Release)
    needs: xcframework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xcframework
          path: ${{ runner.temp }}
      - name: Migrate
        run: .github/migration/migrate.sh "${RUNNER_TEMP}"/graal-native-sdk-*-xcframework.zip
      - name: Build and measure
        run: |
          set -euo pipefail
          for entry in "iphoneos generic/platform=iOS" "iphonesimulator generic/platform=iOS Simulator"; do
            sdk=${entry%% *}; destination=${entry#* }
            xcodebuild build -project DXFeedFramework.xcodeproj -scheme DXFeedFramework -configuration Release \
              -destination "${destination}" -derivedDataPath "build/${sdk}" CODE_SIGNING_ALLOWED=NO -quiet
            binary="build/${sdk}/Build/Products/Release-${sdk}/DXFeedFramework.framework/DXFeedFramework"
            echo "${sdk}.file=$(stat -f %z "${binary}")"
            for arch in $(xcrun lipo -archs "${binary}"); do
              thin="${RUNNER_TEMP}/${sdk}-${arch}"
              xcrun lipo "${binary}" -thin "${arch}" -output "${thin}" 2>/dev/null || cp "${binary}" "${thin}"
              echo "${sdk}.${arch}.file=$(stat -f %z "${thin}")"
              xcrun size -m "${thin}" | awk -v prefix="${sdk}.${arch}." '/^Segment [_A-Z]+: [0-9]+/ { gsub(":", "", $2); print prefix $2 "=" $3 }'
              xcrun size -m "${thin}" | awk -v prefix="${sdk}.${arch}.__DATA," '/Section __svm_heap: [0-9]+/ { print prefix "__svm_heap=" $3 }'
              echo "-- ${sdk} ${arch}: the libraries it loads"
              xcrun otool -L "${thin}" | tail -n +2
            done
          done
