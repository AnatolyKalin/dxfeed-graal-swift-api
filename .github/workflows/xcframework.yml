# Checks DxFeedGraalNativeSdk.xcframework of a graal-native-sdk release as an application does: a Swift package
# (.github/xcframework-consumer) takes it from the GitHub release (binaryTarget with url and checksum), creates an
# isolate with an isolate argument on macOS (arm64, x86_64) and in the iOS Simulator (arm64, x86_64), and builds for iOS.
name: XCFramework

on:
  push:
    branches: [ci/xcframework]

env:
  SDK_VERSION: 3.8.0-rc2
  # swift package compute-checksum of graal-native-sdk-<SDK_VERSION>-xcframework.zip
  SDK_CHECKSUM: 8175e1ead7898679f04f2a7f75a6be63edc848520c0d30882c18b269386f1924

jobs:
  test-macos:
    name: Test (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Take the XCFramework from the release
        run: |
          url="https://github.com/dxFeed/dxfeed-graal-native-sdk/releases/download/v${SDK_VERSION}/graal-native-sdk-${SDK_VERSION}-xcframework.zip"
          sed -i '' "s#.binaryTarget(name: \"DxFeedGraalNativeSdk\", path: \"DxFeedGraalNativeSdk.xcframework\")#.binaryTarget(name: \"DxFeedGraalNativeSdk\", url: \"${url}\", checksum: \"${SDK_CHECKSUM}\")#" .github/xcframework-consumer/Package.swift
          grep -n binaryTarget .github/xcframework-consumer/Package.swift

      - name: Test
        run: |
          set -euo pipefail
          cd .github/xcframework-consumer
          swift test

  test-ios:
    name: Test (iOS Simulator ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Take the XCFramework from the release
        run: |
          url="https://github.com/dxFeed/dxfeed-graal-native-sdk/releases/download/v${SDK_VERSION}/graal-native-sdk-${SDK_VERSION}-xcframework.zip"
          sed -i '' "s#.binaryTarget(name: \"DxFeedGraalNativeSdk\", path: \"DxFeedGraalNativeSdk.xcframework\")#.binaryTarget(name: \"DxFeedGraalNativeSdk\", url: \"${url}\", checksum: \"${SDK_CHECKSUM}\")#" .github/xcframework-consumer/Package.swift
          grep -n binaryTarget .github/xcframework-consumer/Package.swift

      - name: Choose a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [(runtime, device) for runtime, items in devices.items() if ".iOS-" in runtime
                 for device in items if device["name"].startswith("iPhone")]
          version = lambda runtime: [int(part) for part in runtime.rsplit(".iOS-", 1)[1].split("-")]
          runtime, device = max(ios, key=lambda item: version(item[0]))
          print(runtime, device["name"], file=sys.stderr)
          print(device["udid"])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd .github/xcframework-consumer
          xcodebuild -list
          scheme=$(xcodebuild -list -json | python3 -c 'import json, sys; schemes = json.load(sys.stdin)["workspace"]["schemes"]; print(next((s for s in schemes if s.endswith("-Package")), schemes[0]))')
          xcodebuild test -scheme "${scheme}" -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
          if [ "${{ matrix.arch }}" = arm64 ]; then
            xcodebuild build -scheme "${scheme}" -destination generic/platform=iOS
          fi
