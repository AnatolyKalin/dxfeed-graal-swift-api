# Builds DXFeedFramework with a version of the graal-native-sdk (a release of dxFeed/dxfeed-graal-native-sdk) for
# iOS, the iOS Simulator and macOS, and runs the tests on macOS. The version is native_version of build.gradle, or the
# sdk_version input of a manual run.
name: SDK check

on:
  push:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'The graal-native-sdk version, for example 3.7.0-rc3 (empty: native_version of build.gradle)'
        required: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    # macOS 15: an SDK library that requires a newer macOS fails the tests here.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: platform=macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set the SDK version
        if: inputs.sdk_version != ''
        run: sed -i '' "s/^def native_version = .*/def native_version = '${{ inputs.sdk_version }}'/" build.gradle

      - name: Fetch the SDK
        run: |
          grep '^def native_version' build.gradle
          ./gradlew --no-daemon fetchDependencies
          find graal_builds -maxdepth 2 -type f | sort

      - name: Build
        run: >
          xcodebuild build -project DXFeedFramework.xcodeproj -scheme DXFeedFramework
          -destination '${{ matrix.destination }}' CODE_SIGNING_ALLOWED=NO

      - name: Test
        if: matrix.name == 'macOS'
        run: >
          xcodebuild test -project DXFeedFramework.xcodeproj -scheme DXFeedFramework
          -testPlan DXExceptPublisherTests -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

  # Runs the tests in the iOS Simulator: arm64 (the image of the device with the SDK libraries of the arm64 simulator)
  # and x86_64 (the image and the libraries of the x86_64 simulator, built from GraalVM for macOS x64).
  test-ios-simulator:
    name: Test (iOS Simulator, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set the SDK version
        if: inputs.sdk_version != ''
        run: sed -i '' "s/^def native_version = .*/def native_version = '${{ inputs.sdk_version }}'/" build.gradle

      - name: Fetch the SDK
        run: |
          grep '^def native_version' build.gradle
          ./gradlew --no-daemon fetchDependencies

      - name: Choose a simulator
        id: simulator
        run: |
          uname -m
          # The iPhone with the newest iOS runtime installed on the runner.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [(runtime, device) for runtime, items in devices.items() if ".iOS-" in runtime
                 for device in items if device["name"].startswith("iPhone")]
          version = lambda runtime: [int(part) for part in runtime.rsplit(".iOS-", 1)[1].split("-")]
          runtime, device = max(ios, key=lambda item: version(item[0]))
          print(runtime, device["name"], file=sys.stderr)
          print(device["udid"])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: >
          xcodebuild test -project DXFeedFramework.xcodeproj -scheme DXFeedFramework
          -testPlan DXExceptPublisherTests -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO
